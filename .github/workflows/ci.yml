name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build AgentTrace.slnx
      - name: Unit tests
        run: >
          dotnet test --solution AgentTrace.slnx
          --filter-not-trait "Category=Integration"
          --filter-not-trait "Category=Acceptance"
          --filter-not-trait "Category=Parity"
